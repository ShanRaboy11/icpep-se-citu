version: '3.8'

services:
  server:
    build:
      context: ./server
    volumes:
      - ./server:/usr/src/app:delegated
      - server_node_modules:/usr/src/app/node_modules # Use a named volume to preserve image-installed node_modules
    ports:
      - "5000:5000"
    env_file:
      - ./.env
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/icpep_db
    command: npm run dev # Starts nodemon for hot-reloading

  client:
    build:
      context: ./client
    volumes:
      - ./client:/usr/src/app:delegated
      - client_node_modules:/usr/src/app/node_modules # Use a named volume to preserve image-installed node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - server
    environment:
      - CHOKIDAR_USEPOLLING=true # Essential for reliable file watching in Docker
      - WATCHPACK_POLLING=true   # For Webpack/Next.js HMR
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000 # If client needs backend URL
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    command: npm run dev # Starts Next.js dev server with HMR

  mongo:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo-data:
  server_node_modules:
  client_node_modules: